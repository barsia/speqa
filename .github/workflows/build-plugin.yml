name: Build plugin

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version. If empty, build with `0.0.0-dev` and skip the GitHub Release."
        required: false
        type: string

jobs:
  build-windows-dll:
    name: Build Windows DLL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (MSVC)
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version
      - name: Build win_webview2_bridge.dll
        working-directory: native/WinWebView2Bridge
        run: cargo build --release
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-native
          path: native/WinWebView2Bridge/target/release/win_webview2_bridge.dll
          if-no-files-found: error

  build-linux-so:
    name: Build Linux .so (webkit40 + webkit41, zigbuild)
    runs-on: ubuntu-22.04
    env:
      WK40_GLIBC_FLOOR: "2.28"
      WK41_GLIBC_FLOOR: "2.35"
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libx11-dev \
            build-essential \
            binutils
      - name: Install Rust (GNU) + zigbuild
        run: |
          rustup default stable-x86_64-unknown-linux-gnu
          rustup target add x86_64-unknown-linux-gnu
          pip install --user cargo-zigbuild ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rustc --version
          cargo --version
          "$HOME/.local/bin/cargo-zigbuild" --version
      - name: Build liblinux_webkitgtk_bridge.so (webkit41, glibc>=${{ env.WK41_GLIBC_FLOOR }})
        working-directory: native/LinuxWebKitGtkBridge
        run: |
          cargo zigbuild --release --no-default-features --features webkit41 \
            --target "x86_64-unknown-linux-gnu.${WK41_GLIBC_FLOOR}" \
            --target-dir target-wk41
          mkdir -p target-wk41/release
          cp target-wk41/x86_64-unknown-linux-gnu/release/liblinux_webkitgtk_bridge.so \
             target-wk41/release/liblinux_webkitgtk_bridge.so
      - name: Build liblinux_webkitgtk_bridge.so (webkit40, glibc>=${{ env.WK40_GLIBC_FLOOR }})
        working-directory: native/LinuxWebKitGtkBridge
        run: |
          cargo zigbuild --release --no-default-features --features webkit40 \
            --target "x86_64-unknown-linux-gnu.${WK40_GLIBC_FLOOR}" \
            --target-dir target-wk40
          mkdir -p target-wk40/release
          cp target-wk40/x86_64-unknown-linux-gnu/release/liblinux_webkitgtk_bridge.so \
             target-wk40/release/liblinux_webkitgtk_bridge.so
      - name: Verify glibc floor — wk41 must not reference symbols above ${{ env.WK41_GLIBC_FLOOR }}
        working-directory: native/LinuxWebKitGtkBridge
        run: |
          SO=target-wk41/release/liblinux_webkitgtk_bridge.so
          MAX=$(objdump -T "$SO" | awk '{for (i=1;i<=NF;i++) if ($i ~ /^GLIBC_[0-9]/) print $i}' | sed 's/^GLIBC_//' | sort -V | tail -1)
          echo "wk41 max GLIBC symbol: ${MAX:-<none>} (floor ${WK41_GLIBC_FLOOR})"
          if [ -z "$MAX" ]; then exit 0; fi
          HIGHEST=$(printf '%s\n%s\n' "$MAX" "$WK41_GLIBC_FLOOR" | sort -V | tail -1)
          if [ "$HIGHEST" != "$WK41_GLIBC_FLOOR" ]; then
            echo "::error::wk41 requires GLIBC_$MAX, exceeds declared floor GLIBC_${WK41_GLIBC_FLOOR}"
            exit 1
          fi
      - name: Verify glibc floor — wk40 must not reference symbols above ${{ env.WK40_GLIBC_FLOOR }}
        working-directory: native/LinuxWebKitGtkBridge
        run: |
          SO=target-wk40/release/liblinux_webkitgtk_bridge.so
          MAX=$(objdump -T "$SO" | awk '{for (i=1;i<=NF;i++) if ($i ~ /^GLIBC_[0-9]/) print $i}' | sed 's/^GLIBC_//' | sort -V | tail -1)
          echo "wk40 max GLIBC symbol: ${MAX:-<none>} (floor ${WK40_GLIBC_FLOOR})"
          if [ -z "$MAX" ]; then exit 0; fi
          HIGHEST=$(printf '%s\n%s\n' "$MAX" "$WK40_GLIBC_FLOOR" | sort -V | tail -1)
          if [ "$HIGHEST" != "$WK40_GLIBC_FLOOR" ]; then
            echo "::error::wk40 requires GLIBC_$MAX, exceeds declared floor GLIBC_${WK40_GLIBC_FLOOR}"
            exit 1
          fi
      - name: Upload .so artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-native
          path: |
            native/LinuxWebKitGtkBridge/target-wk41/release/liblinux_webkitgtk_bridge.so
            native/LinuxWebKitGtkBridge/target-wk40/release/liblinux_webkitgtk_bridge.so
          if-no-files-found: error

  package:
    name: Package plugin ZIP
    runs-on: ubuntu-latest
    needs: [build-windows-dll, build-linux-so]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download Windows DLL
        uses: actions/download-artifact@v8
        with:
          name: windows-native
          path: native/WinWebView2Bridge/target/release/
      - name: Download Linux .so
        uses: actions/download-artifact@v8
        with:
          name: linux-native
          path: native/LinuxWebKitGtkBridge/
      - name: List staged native artifacts
        run: |
          ls -lah native/WinWebView2Bridge/target/release/
          ls -lah native/LinuxWebKitGtkBridge/target-wk41/release/
          ls -lah native/LinuxWebKitGtkBridge/target-wk40/release/
      - name: Compute plugin version and canonical tag
        id: version
        run: |
          INPUT="${{ inputs.release_tag }}"
          if [ -n "$INPUT" ]; then
            VER="${INPUT#v}"
            TAG="v$VER"
          else
            VER="0.0.0-dev"
            TAG=""
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VER"
          echo "Git tag: ${TAG:-<none>}"
      - name: Build plugin distribution
        run: ./gradlew buildPlugin -PskipNativeBuild=true "-PpluginVersion=${{ steps.version.outputs.value }}" --no-daemon
      - name: Verify ZIP contents
        run: |
          ZIP=$(ls build/distributions/*.zip | head -1)
          echo "ZIP: $ZIP"
          PLUGIN_JAR=$(unzip -l "$ZIP" | awk '$NF ~ /lib\/speqa-[^/]+\.jar$/ && $NF !~ /searchableOptions/ {print $NF}' | head -1)
          if [ -z "$PLUGIN_JAR" ]; then
            echo "Could not locate plugin jar inside $ZIP"
            unzip -l "$ZIP"
            exit 1
          fi
          echo "Plugin jar inside ZIP: $PLUGIN_JAR"
          TMP=$(mktemp -d)
          unzip -p "$ZIP" "$PLUGIN_JAR" > "$TMP/plugin.jar"
          unzip -l "$TMP/plugin.jar" | grep -E "native/windows/WinWebView2Bridge\.dll" || (echo "Windows bridge not packaged under native/windows/ in $PLUGIN_JAR" && unzip -l "$TMP/plugin.jar" | grep -i native && exit 1)
          unzip -l "$TMP/plugin.jar" | grep -E "native/linux/wk41/libLinuxWebKitGtkBridge\.so" || (echo "WebKitGTK 4.1 variant not packaged at native/linux/wk41/ in $PLUGIN_JAR" && unzip -l "$TMP/plugin.jar" | grep -i native && exit 1)
          unzip -l "$TMP/plugin.jar" | grep -E "native/linux/wk40/libLinuxWebKitGtkBridge\.so" || (echo "WebKitGTK 4.0 variant not packaged at native/linux/wk40/ in $PLUGIN_JAR" && unzip -l "$TMP/plugin.jar" | grep -i native && exit 1)
      - name: Upload plugin ZIP artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speqa-${{ steps.version.outputs.value }}
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Create and push annotated tag
        if: ${{ inputs.release_tag != '' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, leaving as-is"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: build/distributions/*.zip
          generate_release_notes: true
