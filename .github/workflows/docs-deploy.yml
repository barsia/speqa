name: Deploy Site + Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Pin the Codocation CLI version. Bump this to upgrade.
  CLI_TAG: cli-v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The Codocation CLI ships as a fat JAR (codocation-cli.jar); it needs a JVM.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Codocation CLI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.CLI_TAG }}
        run: |
          set -e
          mkdir -p .tools
          gh release download "$TAG" \
            -R codocation/codocation \
            -p 'codocation-cli.jar' \
            -D .tools
          ls -la .tools

      - name: Build documentation site
        working-directory: site/docs
        run: java -jar "$GITHUB_WORKSPACE/.tools/codocation-cli.jar" build --out dist

      - name: Prepare combined artifact
        run: |
          mkdir -p _site
          # Landing page: site/ root excluding the docs source
          rsync -a --exclude='docs/' site/ _site/
          # Docs built output under /docs (basePath: /speqa/docs in codocation.yml)
          mkdir -p _site/docs
          rsync -a site/docs/dist/ _site/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
