name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Only what affects the BUILT site: authored content/config and this workflow.
      # AGENTS.md is agent instructions - it never changes the output.
      - 'site/docs/**'
      - '!site/docs/AGENTS.md'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Pin the Codocation CLI version. Bump this to upgrade.
  # The cli-v0.1.0 release must carry the landing feature (frontmatter `sections` /
  # `layout: full`, tree.yml header `button`/`github`): an older jar's validation
  # gate fails the build on these keys.
  CLI_TAG: cli-v0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The Codocation CLI ships as a fat JAR (codocation-cli.jar); it needs a JVM.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Codocation CLI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.CLI_TAG }}
        run: |
          set -e
          mkdir -p .tools
          gh release download "$TAG" \
            -R codocation/codocation \
            -p 'codocation-cli.jar' \
            -D .tools
          ls -la .tools

      - name: Build documentation site
        working-directory: site/docs
        run: java -jar "$GITHUB_WORKSPACE/.tools/codocation-cli.jar" build --out dist

      - name: Prepare artifact
        run: |
          mkdir -p _site
          # The docs site IS the whole site now (its home page is the landing).
          # CLI lays the site out under dist/<siteId> ("speqa-tms"); trailing slash
          # copies contents, so index.html lands at _site/ (= served /speqa/).
          rsync -a site/docs/dist/speqa-tms/ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
